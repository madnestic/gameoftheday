<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>gameoftheday</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=JetBrains+Mono:wght@300;400;700&display=swap');

  :root {
    --bg: #ffffff;
    --ink: #000000;
    --line: 1.5px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* subtle paper-like noise so pure white isn't flat */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 1;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 90%);
  }

  /* ============ HUB ============ */
  .hub {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 28px 24px;
  }

  .hub.hidden { display: none; }

  .hub-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(28px, 6vw, 44px);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .logo-sub {
    font-size: 10px;
    letter-spacing: 0.4em;
    margin-top: 6px;
    opacity: 0.6;
  }

  .hub-meta {
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.3em;
    line-height: 1.8;
    opacity: 0.6;
  }

  .hub-title {
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(40px, 10vw, 88px);
    line-height: 0.95;
    margin-bottom: 8px;
    letter-spacing: -0.03em;
  }

  .hub-title .slash {
    display: inline-block;
    transform: translateY(-4px);
    margin: 0 4px;
  }

  .hub-tagline {
    font-size: 12px;
    letter-spacing: 0.25em;
    opacity: 0.7;
    margin-bottom: 36px;
    max-width: 520px;
    line-height: 1.6;
  }

  .landing-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    text-align: center;
  }

  .landing-title {
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(24px, 4.5vw, 40px);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .play-btn {
    background: transparent;
    border: var(--line) solid var(--ink);
    color: var(--ink);
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(22px, 4vw, 32px);
    letter-spacing: 0.05em;
    padding: 18px 56px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .play-btn:hover, .play-btn:active {
    background: var(--ink);
    color: var(--bg);
    transform: translate(-2px, -2px);
  }

  /* ============ GAME SCREEN ============ */
  .game-screen {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: none;
    flex-direction: column;
    background: var(--bg);
  }

  .game-screen.active { display: flex; }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: var(--line) solid var(--ink);
    font-size: 11px;
    letter-spacing: 0.3em;
  }

  .back-btn {
    background: transparent;
    border: var(--line) solid var(--ink);
    color: var(--ink);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.25em;
    padding: 6px 12px;
    cursor: pointer;
  }

  .back-btn:hover, .back-btn:active {
    background: var(--ink);
    color: var(--bg);
  }

  .game-title-bar {
    font-family: 'Major Mono Display', monospace;
    font-size: 16px;
    letter-spacing: 0;
  }

  .hud {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .hud-label {
    font-size: 8px;
    letter-spacing: 0.3em;
    opacity: 0.6;
  }

  .hud-val {
    font-family: 'Major Mono Display', monospace;
    font-size: 18px;
    letter-spacing: 0;
  }

  .canvas-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }

  canvas {
    border: var(--line) solid var(--ink);
    background: var(--bg);
    display: block;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }

  /* overlay for start / win / lose */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-box {
    border: var(--line) solid var(--ink);
    padding: 32px 40px;
    text-align: center;
    background: var(--bg);
    max-width: 90%;
  }

  .overlay-title {
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(24px, 5vw, 36px);
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }

  .overlay-text {
    font-size: 11px;
    letter-spacing: 0.25em;
    line-height: 1.8;
    margin-bottom: 20px;
    opacity: 0.7;
  }

  .overlay-btn {
    background: transparent;
    border: var(--line) solid var(--ink);
    color: var(--ink);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.3em;
    padding: 10px 24px;
    cursor: pointer;
  }

  .overlay-btn:hover, .overlay-btn:active {
    background: var(--ink);
    color: var(--bg);
  }

  .footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: var(--line) solid var(--ink);
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 0.3em;
    opacity: 0.5;
  }

  @media (max-width: 600px) {
    .hub { padding: 20px 16px; }
    .hub-header { margin-bottom: 28px; }
    .hud { gap: 12px; }
    .hud-val { font-size: 14px; }
    .game-title-bar { display: none; }
  }
</style>
</head>
<body>

<!-- ============ HUB ============ -->
<div class="hub" id="hub">
  <div class="landing-center">
    <div class="landing-title">gameoftheday</div>
    <button class="play-btn" data-game="pongonoid">▸ PLAY</button>
  </div>

  <div class="footer">
    <span>BUILT FOR THE BROWSER</span>
    <span>NO ACCOUNTS · NO ADS</span>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div class="game-screen" id="gameScreen">
  <div class="game-header">
    <button class="back-btn" id="backBtn">← BACK</button>
    <div class="game-title-bar">pongonoid</div>
    <div class="hud">
      <div class="hud-item">
        <div class="hud-label">CPU</div>
        <div class="hud-val" id="cpuScore">0</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">YOU</div>
        <div class="hud-val" id="playerScore">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game"></canvas>
    <div class="overlay visible" id="overlay">
      <div class="overlay-box">
        <div class="overlay-title" id="overlayTitle">pongonoid</div>
        <div class="overlay-text" id="overlayText">
          MOVE / TAP TO LAUNCH<br>
          BLOCK +10 · STOLEN BALL: +10 HITTER, +20 OWNER<br>
          HIT OPPONENT +100 · OWN GOAL −50
        </div>
        <button class="overlay-btn" id="overlayBtn">START</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============ HUB NAVIGATION ============
const hub = document.getElementById('hub');
const gameScreen = document.getElementById('gameScreen');
const backBtn = document.getElementById('backBtn');

document.querySelectorAll('[data-game]').forEach(el => {
  el.addEventListener('click', () => {
    const game = el.dataset.game;
    if (game === 'pongonoid') {
      hub.classList.add('hidden');
      gameScreen.classList.add('active');
      Pongonoid.init();
    }
  });
});

backBtn.addEventListener('click', () => {
  Pongonoid.stop();
  gameScreen.classList.remove('active');
  hub.classList.remove('hidden');
});

// ============ PONGONOID ============
const Pongonoid = (() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const cpuScoreEl = document.getElementById('cpuScore');
  const playerScoreEl = document.getElementById('playerScore');

  // Logical playfield size (we scale the canvas to fit)
  const W = 480;
  const H = 720;

  const PADDLE_W = 90;
  const PADDLE_H = 8;
  const PADDLE_MARGIN = 18;
  const BALL_R = 6;
  const BLOCK_W = 40;
  const BLOCK_H = 18;
  const BLOCK_GAP = 3;
  const COLS = Math.floor(W / (BLOCK_W + BLOCK_GAP));
  const BLOCK_OFFSET_X = (W - COLS * (BLOCK_W + BLOCK_GAP) + BLOCK_GAP) / 2;

  const BLOCK_ROW_INTERVAL = 14000; // ms — new rows added in the center
  const SPLITTER_THRESHOLD = 200;   // splitter blocks start appearing once anyone hits this score
  const SPLITTER_INTERVAL  = 10000; // ms — once threshold is met, convert one block at this rate
  const MAX_BALLS = 8;              // hard cap so splitters can't explode the field

  // ---- Sound (Web Audio) ----
  let audioCtx = null;

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioCtx = null;
    }
    return audioCtx;
  }

  // A short, bright "water drop" blip.
  //   freq    — base pitch (Hz)
  //   gain    — peak loudness (0..1)
  //   dur     — total length (s)
  //   pitchUp — small upward pitch bend at start (drop-like ping)
  function playDrop(freq, gain = 0.18, dur = 0.18, pitchUp = 1.6) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime;

    // main tone — sine for the soft, watery body
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    // start higher, drop down quickly — that "tink" of a drop
    osc.frequency.setValueAtTime(freq * pitchUp, t);
    osc.frequency.exponentialRampToValueAtTime(freq, t + 0.04);

    // a tiny higher partial for shimmer
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(freq * 3, t);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(gain * 0.25, t + 0.003);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.5);

    osc.connect(g).connect(ctx.destination);
    osc2.connect(g2).connect(ctx.destination);

    osc.start(t);
    osc2.start(t);
    osc.stop(t + dur + 0.02);
    osc2.stop(t + dur * 0.5 + 0.02);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  // Pitch tied to where on the field the hit happens — higher hits = higher pitch.
  // Adds a small random variance so repeated hits don't sound identical.
  function pitchForY(y) {
    const t = 1 - (y / H); // 0 at bottom, 1 at top
    return 520 + t * 360; // 520 Hz .. 880 Hz
  }

  function soundBlock(y)  { playDrop(pitchForY(y) * rand(0.97, 1.04), 0.16, 0.18); }
  function soundPaddle(y) { playDrop(pitchForY(y) * rand(0.92, 1.0),  0.20, 0.22, 1.4); }
  function soundWall(y)   { playDrop(pitchForY(y) * rand(0.85, 0.95), 0.10, 0.12, 1.2); }
  function soundScore()   { playDrop(1100, 0.22, 0.30, 1.8); setTimeout(() => playDrop(1500, 0.18, 0.28, 1.6), 80); }
  function soundPenalty() { playDrop(220, 0.22, 0.32, 0.7); }


  let state = null;
  let raf = null;
  let lastT = 0;
  let running = false;

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const maxW = wrap.clientWidth - 24;
    const maxH = wrap.clientHeight - 24;
    const scale = Math.min(maxW / W, maxH / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = W;
    canvas.height = H;
  }

  function makeBall(side) {
    // side: 'player' (bottom) or 'cpu' (top)
    const dir = side === 'player' ? -1 : 1;
    const angle = (Math.random() - 0.5) * 0.6; // small horizontal variance
    const speed = 5.6;
    return {
      x: W / 2 + (Math.random() - 0.5) * 80,
      y: side === 'player' ? H - PADDLE_MARGIN - PADDLE_H - BALL_R - 4
                            : PADDLE_MARGIN + PADDLE_H + BALL_R + 4,
      vx: Math.sin(angle) * speed,
      vy: Math.cos(angle) * speed * dir,
      owner: side,        // who launched it
      lastHitBy: side,    // who paddled it most recently (starts as owner)
      stuck: true,
      disposable: false,  // originals respawn on out; clones are disposable
    };
  }

  function buildInitialBlocks() {
    // Two rows of blocks on each side, separated by a single BLOCK_GAP at the midline.
    // Splitter status is decided separately (periodically, after threshold).
    const blocks = [];
    const midY = H / 2;
    const bottomRow0 = midY + BLOCK_GAP / 2;
    const bottomRow1 = bottomRow0 + BLOCK_H + BLOCK_GAP;
    const topRow0 = midY - BLOCK_GAP / 2 - BLOCK_H;
    const topRow1 = topRow0 - BLOCK_H - BLOCK_GAP;
    blocks.push(...rowBlocks(topRow1));
    blocks.push(...rowBlocks(topRow0));
    blocks.push(...rowBlocks(bottomRow0));
    blocks.push(...rowBlocks(bottomRow1));
    return blocks;
  }

  function rowBlocks(y) {
    const arr = [];
    for (let c = 0; c < COLS; c++) {
      arr.push({
        x: BLOCK_OFFSET_X + c * (BLOCK_W + BLOCK_GAP),
        y,
        w: BLOCK_W,
        h: BLOCK_H,
        alive: true,
        splitter: false,
      });
    }
    return arr;
  }

  const PLAYER_COLORS = [
    '#ff2e6e', // hot pink
    '#ff6b00', // orange
    '#ffd400', // yellow
    '#7cff3a', // lime
    '#00d4ff', // cyan
    '#1f6bff', // electric blue
    '#9b51ff', // purple
    '#ff3a3a', // red
    '#00e5a0', // teal
    '#ff9ed1', // bubblegum
  ];

  function pickPlayerColor() {
    return PLAYER_COLORS[Math.floor(Math.random() * PLAYER_COLORS.length)];
  }

  function reset() {
    state = {
      player: {
        x: W / 2 - PADDLE_W / 2,
        y: H - PADDLE_MARGIN - PADDLE_H,
        score: 0,
      },
      cpu: {
        x: W / 2 - PADDLE_W / 2,
        y: PADDLE_MARGIN,
        score: 0,
      },
      balls: [makeBall('player'), makeBall('cpu')],
      blocks: buildInitialBlocks(),
      popups: [],
      lastRowTime: 0,
      lastSplitterTime: 0,
      gameTime: 0,
      mouseX: W / 2,
      mouseTargetX: W / 2,
      result: null,
      playerColor: pickPlayerColor(),
    };
    updateHUD();
  }

  function updateHUD() {
    cpuScoreEl.textContent = state.cpu.score;
    playerScoreEl.textContent = state.player.score;
  }

  function addPopup(x, y, points, side) {
    state.popups.push({
      x, y,
      points,
      side, // 'player' or 'cpu' — for styling
      life: 1.0, // 0..1, fades out
    });
  }

  function awardPoints(side, points, x, y) {
    if (side === 'player') state.player.score += points;
    else state.cpu.score += points;
    // Only show floating numbers for the player — CPU's points stay in the HUD only.
    if (side === 'player' && x !== undefined) addPopup(x, y, points, side);
    updateHUD();
  }

  function showOverlay(title, text, btnLabel) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = text;
    overlayBtn.textContent = btnLabel;
    overlay.classList.add('visible');
  }

  function hideOverlay() {
    overlay.classList.remove('visible');
  }

  // ---- Input ----
  function getCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    return (clientX - rect.left) * scale;
  }

  function onMove(e) {
    if (!state) return;
    if (e.touches) e.preventDefault();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    state.mouseTargetX = getCanvasX(cx);
  }

  function onClick() {
    if (!state) return;
    // launch any stuck balls owned by player
    state.balls.forEach(b => {
      if (b.owner === 'player' && b.stuck) b.stuck = false;
    });
  }

  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchstart', (e) => { onMove(e); }, { passive: false });
  canvas.addEventListener('click', onClick);
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); onClick(); }, { passive: false });

  // ---- Game Loop ----
  function step(dt) {
    if (state.result) return;
    state.gameTime += dt;

    // Player paddle follows mouse smoothly
    state.player.x += (state.mouseTargetX - PADDLE_W / 2 - state.player.x) * 0.35;
    state.player.x = Math.max(0, Math.min(W - PADDLE_W, state.player.x));

    // CPU paddle: track its own ball (the one moving toward it) with imperfect aim
    const cpuBall = pickBallForCPU();
    if (cpuBall) {
      // Initialize aim offset that drifts over time -> imperfect tracking,
      // and re-pick a "target offset" each time the ball changes direction.
      if (state.cpu.aimOffset === undefined) state.cpu.aimOffset = 0;
      if (state.cpu.lastBallVy === undefined) state.cpu.lastBallVy = 0;

      // when ball reverses direction (after a bounce), commit to a new aim point
      if (cpuBall.vy !== undefined && Math.sign(cpuBall.vy) !== Math.sign(state.cpu.lastBallVy)) {
        // pick a new offset: anywhere from -45% to +45% of paddle width
        state.cpu.aimOffset = (Math.random() - 0.5) * PADDLE_W * 0.9;
      }
      state.cpu.lastBallVy = cpuBall.vy || 0;

      // small continuous drift so the paddle is never perfectly still on the target
      state.cpu.aimOffset += (Math.random() - 0.5) * 0.8;
      state.cpu.aimOffset = Math.max(-PADDLE_W * 0.45, Math.min(PADDLE_W * 0.45, state.cpu.aimOffset));

      const target = cpuBall.x - PADDLE_W / 2 + state.cpu.aimOffset;
      const speed = 3.6; // slightly slower than before so the offset matters
      const diff = target - state.cpu.x;
      const move = Math.max(-speed, Math.min(speed, diff));
      state.cpu.x += move;
      state.cpu.x = Math.max(0, Math.min(W - PADDLE_W, state.cpu.x));
    }

    // CPU launches its stuck ball after a short delay
    state.balls.forEach(b => {
      if (b.owner === 'cpu' && b.stuck && state.gameTime > 800) {
        b.stuck = false;
      }
    });

    // Snapshot the ball list so cloned balls (added by splitter blocks) don't
    // get processed in the same frame — otherwise one hit can cascade into
    // many splits at once. Clones we push during this loop will be picked up
    // on the next frame.
    const ballsThisFrame = state.balls.slice();
    // Update balls
    for (const ball of ballsThisFrame) {
      if (ball.stuck) {
        // stick to its paddle
        const pad = ball.owner === 'player' ? state.player : state.cpu;
        ball.x = pad.x + PADDLE_W / 2;
        continue;
      }
      ball.x += ball.vx;
      ball.y += ball.vy;

      // wall bounces (left/right)
      if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx *= -1; soundWall(ball.y); }
      if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx *= -1; soundWall(ball.y); }

      // Block collisions
      for (const b of state.blocks) {
        if (!b.alive) continue;
        if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
            ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
          b.alive = false;
          soundBlock(b.y);
          //  - The one who last hit the ball always gets the standard +10.
          //  - If they "stole" an opponent's ball (lastHitBy != owner),
          //    the original owner ALSO gets +20 (2x standard).
          const scorer = ball.lastHitBy;
          const cx = b.x + b.w / 2;
          const cy = b.y + b.h / 2;
          awardPoints(scorer, 10, cx, cy);
          if (scorer !== ball.owner) {
            // offset the second popup so they don't overlap
            awardPoints(ball.owner, 20, cx, cy - 14);
          }

          // determine which side to bounce based on previous position
          const prevY = ball.y - ball.vy;
          const fromTop = prevY + BALL_R <= b.y;
          const fromBottom = prevY - BALL_R >= b.y + b.h;
          if (fromTop || fromBottom) ball.vy *= -1;
          else ball.vx *= -1;

          // Splitter block: spawn a one-shot clone heading the other way.
          // Clones are disposable — they don't respawn when they fly out.
          if (b.splitter && state.balls.length < MAX_BALLS) {
            state.balls.push({
              x: ball.x,
              y: ball.y,
              vx: -ball.vx,
              vy: ball.vy,
              owner: ball.owner,
              lastHitBy: ball.lastHitBy,
              stuck: false,
              disposable: true,
            });
            // a brighter, higher chime so splits feel rewarding
            playDrop(pitchForY(b.y) * 1.5, 0.18, 0.22, 1.8);
          }
          break;
        }
      }

      // Paddle collisions
      const paddles = [
        { p: state.player, side: 'bottom', who: 'player' },
        { p: state.cpu, side: 'top', who: 'cpu' },
      ];
      for (const { p, side, who } of paddles) {
        if (ball.x + BALL_R > p.x && ball.x - BALL_R < p.x + PADDLE_W &&
            ball.y + BALL_R > p.y && ball.y - BALL_R < p.y + PADDLE_H) {
          // only bounce if ball moving toward this paddle
          if (side === 'bottom' && ball.vy > 0) {
            ball.y = p.y - BALL_R;
            ball.vy *= -1;
            const rel = (ball.x - (p.x + PADDLE_W / 2)) / (PADDLE_W / 2);
            const speed = Math.hypot(ball.vx, ball.vy);
            const angle = rel * 1.0;
            ball.vx = Math.sin(angle) * speed;
            ball.vy = -Math.abs(Math.cos(angle) * speed);
            ball.lastHitBy = who;
            soundPaddle(ball.y);
          } else if (side === 'top' && ball.vy < 0) {
            ball.y = p.y + PADDLE_H + BALL_R;
            ball.vy *= -1;
            const rel = (ball.x - (p.x + PADDLE_W / 2)) / (PADDLE_W / 2);
            const speed = Math.hypot(ball.vx, ball.vy);
            const angle = rel * 1.0;
            ball.vx = Math.sin(angle) * speed;
            ball.vy = Math.abs(Math.cos(angle) * speed);
            ball.lastHitBy = who;
            soundPaddle(ball.y);
          }
        }
      }

      // Out of bounds — scoring event
      if (ball.y < -BALL_R) {
        // Ball passed CPU's paddle (top)
        const shooter = ball.lastHitBy;
        if (shooter === 'cpu') {
          awardPoints('cpu', -50, ball.x, 30);
          soundPenalty();
        } else {
          awardPoints('player', 100, ball.x, 30);
          soundScore();
        }
        retireBall(ball);
      } else if (ball.y > H + BALL_R) {
        const shooter = ball.lastHitBy;
        if (shooter === 'player') {
          awardPoints('player', -50, ball.x, H - 30);
          soundPenalty();
        } else {
          awardPoints('cpu', 100, ball.x, H - 30);
          soundScore();
        }
        retireBall(ball);
      }
    }

    // Drop any disposable balls that flew out this frame.
    if (state.balls.some(b => b.removed)) {
      state.balls = state.balls.filter(b => !b.removed);
    }

    // Update popups (fade & rise)
    for (const pop of state.popups) {
      pop.life -= dt / 900; // ~0.9s lifetime
      pop.y -= dt * 0.03;   // drift upward
    }
    state.popups = state.popups.filter(p => p.life > 0);

    // Add a new row periodically
    if (state.gameTime - state.lastRowTime > BLOCK_ROW_INTERVAL) {
      state.lastRowTime = state.gameTime;
      addRow();
    }

    // Once either side is past the threshold, periodically promote a single
    // random alive (non-splitter) block to a splitter — one at a time.
    const passedThreshold = Math.max(state.player.score, state.cpu.score) >= SPLITTER_THRESHOLD;
    if (passedThreshold && state.gameTime - state.lastSplitterTime > SPLITTER_INTERVAL) {
      state.lastSplitterTime = state.gameTime;
      promoteSplitter();
    }
  }

  function promoteSplitter() {
    const candidates = state.blocks.filter(b => b.alive && !b.splitter);
    if (!candidates.length) return;
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    pick.splitter = true;
  }

  function pickBallForCPU() {
    // Pick the ball heading toward the CPU paddle that's closest
    let best = null;
    let bestDist = Infinity;
    for (const b of state.balls) {
      if (b.stuck) continue;
      if (b.vy < 0) {
        const d = b.y;
        if (d < bestDist) { bestDist = d; best = b; }
      }
    }
    if (!best) {
      // no ball coming, drift toward center
      best = { x: W / 2 };
    }
    return best;
  }

  function addRow() {
    // New rows appear in the CENTER and push existing blocks outward.
    // Blocks above the midline drift up; blocks below drift down.
    const midY = H / 2;
    const shift = BLOCK_H + BLOCK_GAP;

    for (const b of state.blocks) {
      if (!b.alive) continue;
      const blockMid = b.y + b.h / 2;
      if (blockMid < midY) {
        b.y -= shift;
      } else {
        b.y += shift;
      }
    }

    // Drop blocks that got pushed too close to either paddle
    state.blocks = state.blocks.filter(b => {
      if (!b.alive) return false;
      if (b.y < PADDLE_MARGIN + PADDLE_H + 30) return false;
      if (b.y + b.h > H - PADDLE_MARGIN - PADDLE_H - 30) return false;
      return true;
    });

    // Add the two new rows centered on the midline (same gap as everywhere else)
    const topRowY = midY - BLOCK_GAP / 2 - BLOCK_H;
    const bottomRowY = midY + BLOCK_GAP / 2;
    state.blocks.push(...rowBlocks(topRowY));
    state.blocks.push(...rowBlocks(bottomRowY));

    // Safety: remove any block that ended up overlapping a live ball
    for (const ball of state.balls) {
      if (ball.stuck) continue;
      for (const b of state.blocks) {
        if (!b.alive) continue;
        if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
            ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
          b.alive = false;
        }
      }
    }
  }

  function retireBall(ball) {
    // Disposable clones (from splitters) just vanish; the two original balls
    // get respawned on the side that needs one most.
    if (ball.disposable) {
      ball.removed = true;
      return;
    }
    respawnBall(ball);
  }

  function respawnBall(ball) {
    // Look at the OTHER balls (excluding this one which just went out).
    // Count how many are on each side based on direction of travel toward
    // their respective paddles. We use vertical position as a proxy for
    // "which half is the ball currently in".
    const midY = H / 2;
    let playerHas = false;
    let cpuHas = false;
    for (const other of state.balls) {
      if (other === ball) continue;
      // a "stuck" ball is on its owner's side
      if (other.stuck) {
        if (other.owner === 'player') playerHas = true;
        else cpuHas = true;
        continue;
      }
      if (other.y >= midY) playerHas = true;
      else cpuHas = true;
    }

    let serveTo;
    if (!playerHas && cpuHas) {
      serveTo = 'player';
    } else if (!cpuHas && playerHas) {
      serveTo = 'cpu';
    } else {
      // both sides have a ball, or neither — fall back to original owner
      serveTo = ball.owner;
    }

    const fresh = makeBall(serveTo);
    fresh.owner = serveTo; // update ownership so future logic is consistent
    Object.assign(ball, fresh);
  }

  // ---- Render ----
  function draw() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;

    // Blocks — CPU side (top half) filled black, player side (bottom half) outlined.
    // Splitter blocks carry an "x" mark so the player can spot them from afar.
    const midY = H / 2;
    ctx.lineWidth = 1;
    for (const b of state.blocks) {
      if (!b.alive) continue;
      const blockMid = b.y + b.h / 2;
      const onCpuSide = blockMid < midY;
      if (onCpuSide) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      } else {
        ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      }
      if (b.splitter) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        const r = 5;
        ctx.save();
        ctx.strokeStyle = onCpuSide ? '#ffffff' : '#000000';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
        ctx.stroke();
        ctx.restore();
      }
    }

    // Paddles
    ctx.lineWidth = 1.5;
    // player paddle — bright fill
    ctx.fillStyle = state.playerColor;
    ctx.fillRect(state.player.x, state.player.y, PADDLE_W, PADDLE_H);
    ctx.strokeStyle = '#000000';
    ctx.strokeRect(state.player.x + 0.5, state.player.y + 0.5, PADDLE_W - 1, PADDLE_H - 1);
    // cpu paddle — outline only
    ctx.strokeRect(state.cpu.x + 0.5, state.cpu.y + 0.5, PADDLE_W - 1, PADDLE_H - 1);

    // Balls (outline circles)
    for (const ball of state.balls) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.stroke();
    }

    // tiny markers on each paddle to distinguish player/cpu
    ctx.lineWidth = 1;
    // player has tick marks (white on colored fill)
    ctx.strokeStyle = '#ffffff';
    for (let i = 1; i < 4; i++) {
      const tx = state.player.x + (PADDLE_W * i / 4);
      ctx.beginPath();
      ctx.moveTo(tx, state.player.y + 2);
      ctx.lineTo(tx, state.player.y + PADDLE_H - 2);
      ctx.stroke();
    }
    ctx.strokeStyle = '#000000';
    // cpu has dotted marks
    ctx.save();
    ctx.setLineDash([1, 2]);
    for (let i = 1; i < 4; i++) {
      const tx = state.cpu.x + (PADDLE_W * i / 4);
      ctx.beginPath();
      ctx.moveTo(tx, state.cpu.y + 2);
      ctx.lineTo(tx, state.cpu.y + PADDLE_H - 2);
      ctx.stroke();
    }
    ctx.restore();

    // Score popups
    ctx.save();
    ctx.font = 'bold 14px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const pop of state.popups) {
      const alpha = Math.max(0, Math.min(1, pop.life));
      ctx.globalAlpha = alpha;
      const sign = pop.points >= 0 ? '+' : '';
      const text = sign + pop.points;
      // outline (white halo) + black text for readability
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.strokeText(text, pop.x, pop.y);
      ctx.fillStyle = '#000000';
      ctx.fillText(text, pop.x, pop.y);
    }
    ctx.restore();
  }

  function loop(t) {
    if (!running) return;
    if (!lastT) lastT = t;
    const dt = t - lastT;
    lastT = t;
    step(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    hideOverlay();
    reset();
    // Wake/resume audio on user gesture
    const ctx = ensureAudio();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    running = true;
    lastT = 0;
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function init() {
    resizeCanvas();
    reset();
    draw();
    showOverlay('pongonoid',
      'MOVE / TAP TO LAUNCH<br>BLOCK +10 · STOLEN BALL: +10 HITTER, +20 OWNER<br>HIT OPPONENT +100 · OWN GOAL −50',
      'START');
  }

  overlayBtn.addEventListener('click', () => {
    if (!running) {
      start();
    } else if (state && state.result) {
      // play again from end screen
      start();
    }
  });

  window.addEventListener('resize', () => {
    resizeCanvas();
    if (state) draw();
  });

  return { init, stop };
})();
</script>

</body>
</html>
